name: Feature request
description: Something Kestrel should do, or do differently.
title: "[idea] "
labels: ["idea", "early-access"]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What are you trying to do that's hard or impossible today?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Your proposal }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes: { label: Area, options: ["Portfolios", "Rebalancing engine", "VANE / custody", "Edge", "Website", "x402 / agents", "Other"] }
